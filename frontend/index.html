<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChainID & Assets — Demo Blockchain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Playpen+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M12 22 L32 10 L52 21 L53 43 L32 55 L11 43 Z" fill="#ffe066" stroke="#2b2a28" stroke-width="3" stroke-linejoin="round"/>
        <path d="M12 22 L32 33 L52 21 M32 33 L32 55" fill="none" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 16 L42 27" fill="none" stroke="#2b2a28" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>
      </svg>
      <div>
        <h1>ChainID <span class="amp">&amp;</span> Assets</h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn small ghost" id="langBtn" type="button"></button>
      <a class="btn small ghost" id="docsLink" href="docs/" target="_blank" rel="noopener"></a>
      <div id="walletBox"></div>
    </div>
  </header>

  <div id="banner"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>

  <footer class="footer" id="footer"></footer>
  <div id="toasts" aria-live="polite"></div>

  <script src="vendor/ethers.umd.min.js"></script>
  <script src="contracts.js"></script>
  <script src="config.js"></script>
  <script>
    // Khi chạy trên máy (localhost) thì ưu tiên contract đã deploy vào node Hardhat local, nếu có
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="config.local.js"><\/script>');
  </script>
  <script>
    // Chế độ demo (blockchain mô phỏng trong trình duyệt): xem giải thích trong demo-mode.js
    (function () {
      var q = new URLSearchParams(location.search);
      window.DAPP_DEMO = !window.DAPP_CONFIG || (!q.has("wallet") && (q.has("demo") || q.has("shim") || !window.ethereum));
      if (window.DAPP_DEMO) document.write('<script src="vendor/sim-chain.js"><\/script>');
    })();
  </script>
  <script src="demo-mode.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
