<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Demo định danh số và token hoá tài sản trên blockchain Ethereum">
  <title>ChainID & Assets — Demo Blockchain</title>
  <script>
    // Chọn giao diện sáng/tối trước khi vẽ trang để không bị nháy màu
    (function () {
      var theme = new URLSearchParams(location.search).get("theme");
      try { theme = theme || localStorage.getItem("demo.theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="./" aria-label="ChainID & Assets">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 27 9.5v13L16 29 5 22.500v-13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M5 9.500 16 16l11-6.500M16 16v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
          <circle cx="16" cy="16" r="2.600" fill="var(--accent-2)"/>
        </svg>
        <span class="brand-name">ChainID<span class="amp">&amp;</span>Assets</span>
      </a>
      <div class="top-actions">
        <span id="netChip"></span>
        <button class="icon-btn" id="langBtn" type="button"></button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme"></button>
        <a class="icon-btn" id="docsLink" href="docs/" target="_blank" rel="noopener"></a>
        <div id="walletBox"></div>
      </div>
    </div>
  </header>

  <div class="wrap" id="banner"></div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main class="wrap" id="view"></main>
  <footer class="wrap footer" id="footer"></footer>
  <div id="toasts" aria-live="polite"></div>

  <script src="vendor/ethers.umd.min.js"></script>
  <script src="contracts.js"></script>
  <script src="config.js"></script>
  <script>
    // Khi chạy trên máy (localhost) thì ưu tiên contract đã deploy vào node Hardhat local, nếu có
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="config.local.js"><\/script>');
  </script>
  <script>
    // Chế độ demo (blockchain mô phỏng trong trình duyệt): xem giải thích trong demo-mode.js
    (function () {
      var q = new URLSearchParams(location.search);
      window.DAPP_DEMO = !window.DAPP_CONFIG || (!q.has("wallet") && (q.has("demo") || q.has("shim") || !window.ethereum));
      if (window.DAPP_DEMO) document.write('<script src="vendor/sim-chain.js"><\/script>');
    })();
  </script>
  <script src="demo-mode.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
